openapi: 3.0.3
info:
  title: Example API
  version: 1.0.0
  description: A minimal OpenAPI document for demo purposes.
paths:
  /widgets:
    get:
      summary: List widgets
      responses:
        "200":
          description: A list of widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
    post:
      summary: Create a widget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Widget"
      responses:
        "201":
          description: Created
components:
  schemas:
    Widget:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 0
