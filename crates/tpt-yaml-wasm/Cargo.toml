[package]
name = "tpt-yaml-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "wasm-bindgen bindings for parsing and converting YAML in the browser or Node.js."
keywords = ["yaml", "wasm", "javascript", "bindings"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tpt-yaml-core = { path = "../tpt-yaml-core", version = "0.1.0" }
tpt-yaml-serde = { path = "../tpt-yaml-serde", version = "0.1.0" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
serde_json = "1.0"
