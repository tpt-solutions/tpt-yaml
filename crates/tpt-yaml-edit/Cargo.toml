[package]
name = "tpt-yaml-edit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lossless, span-preserving YAML editing over tpt-yaml-core: change a value and re-render only the touched subtree."
keywords = ["yaml", "editor", "lossless", "formatting"]
categories = ["text-processing", "development-tools"]

[dependencies]
serde = { workspace = true, optional = true }
tpt-yaml-core = { path = "../tpt-yaml-core", version = "0.1.0", default-features = false, features = ["alloc"] }
tpt-yaml-serde = { path = "../tpt-yaml-serde", version = "0.1.0", optional = true, default-features = false }

[features]
default = ["std"]
std = ["tpt-yaml-core/std", "tpt-yaml-serde/std"]
alloc = ["tpt-yaml-core/alloc"]
typed = ["dep:tpt-yaml-serde", "dep:serde", "tpt-yaml-serde/std"]

[dev-dependencies]
proptest = "1"
