[package]
name = "tpt-yaml-serde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Serde Deserializer/Serializer and a dynamic Value type for tpt-yaml-core YAML documents."
keywords = ["yaml", "serde", "serialize", "deserialize"]
categories = ["encoding", "parser-implementations"]

[dependencies]
serde.workspace = true
tpt-yaml-core = { path = "../tpt-yaml-core", version = "0.1.0", default-features = false, features = ["alloc"] }

[features]
default = ["std"]
std = ["serde/std", "tpt-yaml-core/std"]
alloc = ["serde/alloc", "tpt-yaml-core/alloc"]
streaming = ["alloc"]

[dev-dependencies]
# See `tpt-yaml-core/Cargo.toml`'s comment: pinned to the newest release within this
# workspace's 1.75 MSRV.
criterion = { version = "=0.5.1", features = ["html_reports"] }
# See `tpt-yaml-core/Cargo.toml`'s comment: capped below 1.9 to stay within this workspace's
# MSRV (1.75).
proptest = ">=1, <1.9"
# Head-to-head baseline for benches/roundtrip.rs: the standard serde Serializer/Deserializer
# for YAML. Deprecated upstream (archived in favor of no single clear successor) but still the
# most widely used serde<->YAML bridge, which is the relevant comparison for this crate.
serde_yaml = "=0.9.34"

[[bench]]
name = "roundtrip"
harness = false
