[package]
name = "tpt-yaml-core-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opts this crate out of the workspace at the repo root — cargo-fuzz targets need a nightly
# toolchain and shouldn't affect `cargo build --workspace` on stable.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-yaml-core]
path = ".."

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false
