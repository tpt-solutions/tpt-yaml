[package]
name = "tpt-yaml-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lexer, parser, and arena-based node model for YAML 1.1/1.2, with zero external dependencies and no_std + alloc support."
keywords = ["yaml", "parser", "lexer", "no-std"]
categories = ["parser-implementations", "no-std", "encoding"]

[features]
default = ["std"]
std = []
alloc = []

[dev-dependencies]
proptest = "1"
