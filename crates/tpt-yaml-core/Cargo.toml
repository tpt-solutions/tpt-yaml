[package]
name = "tpt-yaml-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Lexer, parser, and arena-based node model for YAML 1.1/1.2, with zero external dependencies and no_std + alloc support."
keywords = ["yaml", "parser", "lexer", "no-std"]
categories = ["parser-implementations", "no-std", "encoding"]

[features]
default = ["std"]
std = []
alloc = []

[dev-dependencies]
# Capped below 1.9: proptest 1.9+ requires rustc 1.82, past this workspace's MSRV (1.75, see
# AGENTS.md); `cargo update` would otherwise silently pick a version that breaks the `msrv` CI
# job. 1.8 is the newest release that still supports 1.75.
proptest = ">=1, <1.9"
