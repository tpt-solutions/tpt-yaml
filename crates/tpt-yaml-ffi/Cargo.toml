[package]
name = "tpt-yaml-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A stable, panic-free C ABI over tpt-yaml-core's YAML parser and node arena, for embedding in non-Rust code."
keywords = ["yaml", "ffi", "c-bindings", "cabi"]
categories = ["external-ffi-bindings", "development-tools::ffi"]
# `include/tpt_yaml.h` is generated by `build.rs` (via `cbindgen`) but also checked into the
# crate so consumers building from a `cargo publish`ed tarball (which doesn't run the generator
# unless `build.rs` is present, which it is) or without network access still get a header.
include = ["src/**/*", "include/**/*", "build.rs", "cbindgen.toml", "README.md", "CHANGELOG.md"]

[lib]
# `cdylib` for C/Python/JS consumers linking against the shared library; `rlib` so this crate can
# still be used as an ordinary Rust dependency (e.g. by future in-repo integration tests).
crate-type = ["cdylib", "rlib"]

[dependencies]
# `tpt-yaml-ffi` is intentionally std-only (same exception class as `tpt-yaml-cli`, see
# `AGENTS.md`): a foreign-language bindings layer has no reason to run in `no_std`
# environments, so unlike every other crate in the family it depends on `tpt-yaml-core` with
# default features (which pull in `std`) rather than `default-features = false, features =
# ["alloc"]`.
tpt-yaml-core = { path = "../tpt-yaml-core", version = "0.1.0" }
# Optional deps for the typed/edit surface planned for the Python/JS binding crates that will
# sit on top of this one; not yet consumed by any `extern "C"` function in this crate.
tpt-yaml-edit = { path = "../tpt-yaml-edit", version = "0.1.0", optional = true }
tpt-yaml-serde = { path = "../tpt-yaml-serde", version = "0.1.0", optional = true }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[features]
default = []
# Reserved for a future typed/serde-routed FFI surface (e.g. round-tripping through
# `tpt-yaml-serde::Value`); not yet exposed by any `extern "C"` function.
typed = ["dep:tpt-yaml-serde"]
# Reserved for a future FFI surface over `tpt-yaml-edit`'s mutate/render API; not yet exposed by
# any `extern "C"` function.
edit = ["dep:tpt-yaml-edit"]

[dev-dependencies]
