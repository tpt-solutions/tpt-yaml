[package]
name = "tpt-yaml-ffi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Opts this crate out of the workspace at the repo root — cargo-fuzz targets need a nightly
# toolchain and shouldn't affect `cargo build --workspace` on stable.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-yaml-ffi]
path = ".."

[[bin]]
name = "ffi_parse_roundtrip"
path = "fuzz_targets/ffi_parse_roundtrip.rs"
test = false
doc = false
bench = false
