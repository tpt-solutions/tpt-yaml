language = "C"
header = """/* Generated by cbindgen from crates/tpt-yaml-ffi. DO NOT EDIT BY HAND.
 * Regenerate with: cargo build -p tpt-yaml-ffi (build.rs runs cbindgen automatically). */"""
include_guard = "TPT_YAML_H"
braces = "SameLine"
line_length = 100
tab_width = 4
documentation = true
documentation_style = "doxy"
style = "both"

[enum]
prefix_with_name = false
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
